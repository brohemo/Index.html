<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Pickup Code</title>
  <style>
    :root { --bg:#f5f6f7; --card:#fff; --ink:#111; --muted:#6b7280; --accent:#111; --ok:#065f46; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 16px; }
    .card { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .label { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    .field { margin-top: 4px; border: 1px solid var(--border); background: #f9fafb; padding: 10px 12px; border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; }
    .word { font-weight: 700; font-size: 24px; background: #eef2ff; border-color: #c7d2fe; }
    .word.locked { background: #ecfdf5; border-color: #a7f3d0; }
    .hint { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; }
    button[disabled] { background: #e5e7eb; color: #9ca3af; border-color: #e5e7eb; }
    .btn-plain { background: #fff; color: var(--ink); }
    ul { margin: 10px 0 0; padding-left: 18px; }
    li { font-size: 12px; color: var(--muted); margin: 4px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main">
      <h1>Family Pickup Code</h1>
      <div class="sub">Timezone: <span id="tz"></span></div><div>
    <div class="label">Date (auto)</div>
    <div id="date" class="field">0000-00-00</div>
  </div>

  <div style="margin-top:12px;">
    <div class="label">Today's Word</div>
    <div id="word" class="field word">...</div>
    <div id="hint" class="hint">Refresh until you lock it.</div>
  </div>

  <div class="row">
    <button id="refresh">Refresh word</button>
    <button id="lock" class="btn-plain">Lock (PIN)</button>
    <button id="unlock" class="btn-plain">Unlock (PIN)</button>
  </div>

  <section style="margin-top:12px; border:1px solid var(--border); background:#f9fafb; border-radius:10px; padding:10px">
    <div class="label" style="margin-bottom:6px;">How it works</div>
    <ul>
      <li>Date follows America/Detroit and rolls at local midnight.</li>
      <li>Each day stores an independent word and lock state on this device.</li>
    </ul>
  </section>
</main>

  </div>  <script>
    const PIN_CODE = "2587";
    const TZ = "America/Detroit";
    const STORE_KEY = "fpc.words";

    function detroitDateISO() {
      const now = new Date();
      return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(now);
    }

    function readStore() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; }
    }
    function writeStore(obj) { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }

    function generateWord() {
      const A = ["sun","map","tree","blue","star","rain","cat","dog","nest","milk","book","fish","rock","sand","snow","leaf","truck","train","ball","kite","fox","owl","berry","honey","moss","mint"];
      const B = ["berry","cake","shine","light","house","river","stone","song","cloud","spark","path","wind","wheel","field","dock","bridge","gate","trail","lane","way","patch","glow","garden","story"];
      const a = A[Math.floor(Math.random()*A.length)];
      const b = B[Math.floor(Math.random()*B.length)];
      const w = a === b ? a + "go" : a + b;
      return w.toLowerCase();
    }

    const elTZ = document.getElementById("tz");
    const elDate = document.getElementById("date");
    const elWord = document.getElementById("word");
    const elHint = document.getElementById("hint");
    const btnRefresh = document.getElementById("refresh");
    const btnLock = document.getElementById("lock");
    const btnUnlock = document.getElementById("unlock");

    elTZ.textContent = TZ;

    let today = detroitDateISO();

    function loadToday() {
      const store = readStore();
      if (!store[today]) {
        store[today] = { word: generateWord(), locked: false };
        writeStore(store);
      }
      const { word, locked } = store[today];
      elDate.textContent = today;
      elWord.textContent = word;
      elWord.classList.toggle("locked", locked);
      btnRefresh.disabled = !!locked;
      elHint.textContent = locked ? "Locked for today. Unlock with PIN to change." : "Refresh until you lock it.";
    }

    setInterval(() => {
      const d = detroitDateISO();
      if (d !== today) {
        today = d;
        loadToday();
      }
    }, 30000);

    btnRefresh.addEventListener("click", () => {
      const store = readStore();
      const rec = store[today] || { word: generateWord(), locked: false };
      if (rec.locked) { alert("Today's word is locked. Unlock with the PIN to change it."); return; }
      rec.word = generateWord();
      store[today] = rec; writeStore(store);
      elWord.textContent = rec.word;
    });

    btnLock.addEventListener("click", () => {
      const store = readStore();
      const rec = store[today] || { word: generateWord(), locked: false };
      if (rec.locked) { alert("Already locked for today."); return; }
      const pin = prompt("Enter 4-digit PIN to lock today's word:");
      if (pin == null) return;
      if (pin.trim() !== PIN_CODE) { alert("Incorrect PIN."); return; }
      rec.locked = true; store[today] = rec; writeStore(store); loadToday(); alert("Locked for today.");
    });

    btnUnlock.addEventListener("click", () => {
      const store = readStore();
      const rec = store[today] || { word: generateWord(), locked: false };
      if (!rec.locked) { alert("It's not locked."); return; }
      const pin = prompt("Enter 4-digit PIN to unlock:");
      if (pin == null) return;
      if (pin.trim() !== PIN_CODE) { alert("Incorrect PIN."); return; }
      rec.locked = false; store[today] = rec; writeStore(store); loadToday(); alert("Unlocked. You can refresh the word again.");
    });

    loadToday();
  </script></body>
</html>
